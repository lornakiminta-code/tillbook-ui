<main class="wrap"><h1>Contact us</h1><p class="muted">Questions about TillBook or want an account? Send us a message.</p>
<form class="form" data-message="Thank you. Your message has been recorded.">
<label for="nm">Your name</label><input id="nm" required>
<label for="em">Email address</label><input id="em" type="email" required>
<label for="msg">Message</label><textarea id="msg" rows="4" required></textarea>
<button class="btn" type="submit">Send message</button><div class="msg" hidden></div></form></main>

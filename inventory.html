<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory | TillBook</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/app.js"></script>
</head>
<body>
<header class="top"><a class="logo" href="index.html"><img src="../assets/logo.svg" alt="" width="28" height="28">TillBook</a>
<nav id="menu"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="inventory.html">Inventory</a><a href="sales.html">Record a sale</a><a href="contact.html">Contact</a><a class="btn" href="login.html">Log in</a></nav></header>
<main class="wrap"><h1>Inventory</h1>
<label for="q">Search items</label><input id="q" type="search" placeholder="Type an item name">
<table style="margin-top:1rem"><tr><th>Item</th><th>Price (KES)</th><th>In stock</th><th>Status</th></tr>
<tr><td>Sugar 1kg</td><td>160</td><td>42</td><td><span class="tag">In stock</span></td></tr>
<tr><td>Cooking oil 1L</td><td>320</td><td>6</td><td><span class="tag low">Low</span></td></tr>
<tr><td>Bread</td><td>60</td><td>25</td><td><span class="tag">In stock</span></td></tr>
<tr><td>Milk 500ml</td><td>65</td><td>3</td><td><span class="tag low">Low</span></td></tr></table>
<h2 style="margin-top:2rem">Add a new item</h2>
<form class="form" data-message="Item added to your list.">
<label for="n">Item name</label><input id="n" required>
<label for="p">Price (KES)</label><input id="p" type="number" min="0" required>
<label for="s">Quantity in stock</label><input id="s" type="number" min="0" required>
<button class="btn" type="submit">Add item</button><div class="msg" hidden></div></form></main>
<footer>&copy; <span id="year">2026</span> TillBook. Built as a class project.</footer></body></html>
